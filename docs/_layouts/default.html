<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}RealityGate</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <style>
    :root { color-scheme: light; font: 17px/1.6 system-ui, sans-serif; }
    body { max-width: 820px; margin: 0 auto; padding: 1.5rem; color: #18212b; background: #fff; }
    header, footer { display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
    header { border-bottom: 1px solid #d8e1e7; padding-bottom: 1rem; }
    footer { border-top: 1px solid #d8e1e7; margin-top: 3rem; padding-top: 1rem; }
    main { margin-top: 2.5rem; }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); }
    h2 { margin-top: 2.3rem; }
    a { color: #075b92; }
    a:focus-visible { outline: 3px solid #e09032; outline-offset: 3px; }
    code, pre { background: #f2f5f7; border-radius: .3rem; }
    code { padding: .1rem .25rem; }
    pre { overflow-x: auto; padding: 1rem; }
    pre code { padding: 0; }
    table { display: block; overflow-x: auto; border-collapse: collapse; }
    th, td { padding: .5rem .7rem; border: 1px solid #d8e1e7; text-align: left; }
    blockquote { border-left: 3px solid #075b92; margin-left: 0; padding-left: 1rem; }
  </style>
</head>
<body>
  <header>
    <strong><a href="{{ '/' | relative_url }}">RealityGate</a></strong>
    <a href="{{ '/#guides' | relative_url }}">Guides</a>
    <a href="https://github.com/usmanmanii/realitygate">GitHub</a>
    <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a>
  </header>
  <main>{{ content }}</main>
  <footer>
    <span>MIT © Muhammad Usman</span>
    <a href="https://github.com/usmanmanii/realitygate/blob/main/README.md">Full documentation</a>
  </footer>
</body>
</html>
